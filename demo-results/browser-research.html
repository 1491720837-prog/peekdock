    <style>
      body { max-width: 760px; margin: 60px auto; padding: 0 24px; color: #eaf4ff; background: #07101a; font: 16px/1.75 -apple-system, BlinkMacSystemFont, sans-serif; }
      small { color: #61b7ff; letter-spacing: .14em; font-weight: 700; }
      h1 { font-size: 42px; line-height: 1.05; margin: 12px 0 30px; }
      section { padding: 22px; margin: 14px 0; border: 1px solid #18344d; border-radius: 18px; background: #0b1825; }

  <body>
    <small>BROWSER AGENT / VERIFIED DEMO OUTPUT</small>
    <h1>AI 桌面外设竞品调研摘要</h1>
    <span class="done">✓ 8 sources checked</span>
    <section>
      <h2>核心发现</h2>
      <ul>
        <li>Stream Deck 强在主动输入，但不理解 AI 异步任务状态。</li>
        <li>像素屏适合低打扰展示，却缺少工作流状态语义和行动入口。</li>
        <li>PeekDock 的机会是“统一状态标准 + 拟人化硬件交互”，而不是再造一块副屏。</li>
      </ul>
    </section>
    <section>
      <h2>建议</h2>
      <p>比赛演示优先证明语音派活、Input Required 主动召回和多 Agent 横切三件事。</p>
    </section>
  </body>
